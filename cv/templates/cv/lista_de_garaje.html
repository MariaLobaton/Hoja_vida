<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Venta de garage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="mb-0">🛒 Venta de garage</h3>
      <a href="{% url 'cv_view' %}" class="btn btn-outline-secondary btn-sm">⬅ Volver</a>
    </div>

    {% if productos %}
      <div class="row g-3">
        {% for p in productos %}
          <div class="col-12 col-md-6 col-lg-4">
            <div class="card shadow-sm h-100">
              <div class="card-body">

                <div class="d-flex justify-content-between align-items-start">
                  <h6 class="fw-bold mb-1">{{ p.nombreproducto }}</h6>
                  <span class="badge bg-success">${{ p.valordelbien }}</span>
                </div>

                <p class="text-muted mb-2" style="font-size: 13px;">
                  {{ p.estadoproducto }}
                </p>

                {% if p.descripcion %}
                  <p class="mb-3" style="font-size: 14px;">{{ p.descripcion }}</p>
                {% endif %}

                <a href="#" class="btn btn-primary w-100">
                  🛒 Comprar / Contactar
                </a>

              </div>
            </div>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <div class="alert alert-warning">
        No hay productos disponibles.
      </div>
    {% endif %}

  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Venta de garage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
  <div class="text-center mb-4">
    <h3 class="fw-bold">🛒 Artículos personales en venta</h3>
    <p class="text-muted mb-2">Contacta directamente si te interesa algo.</p>
    <a href="{% url 'cv_view' %}" class="text-decoration-none">← Volver al CV</a>
  </div>

  <div class="row g-4">
    {% for g in productos %}
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm border-0 h-100" style="border-radius: 16px;">
          <!-- Si luego agregas foto, aquí va -->
          <!-- <img src="{{ g.foto.url }}" class="card-img-top" style="height:200px; object-fit:cover; border-top-left-radius:16px; border-top-right-radius:16px;"> -->

          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <h5 class="fw-bold mb-1">{{ g.nombreproducto }}</h5>
              <span class="badge bg-success fs-6">${{ g.valordelbien }}</span>
            </div>

            <div class="text-muted mb-2" style="font-size: 13px;">
              {{ g.estadoproducto }}
            </div>

            <p class="mb-3">{{ g.descripcion }}</p>

            <a class="btn btn-success w-100"
               target="_blank"
               href="https://wa.me/593978716097?text=Hola%20quiero%20comprar%20el%20producto:%20{{ g.nombreproducto }}%20por%20${{ g.valordelbien }}">
              🛒 Comprar / Contactar
            </a>
          </div>
        </div>
      </div>
    {% empty %}
      <div class="col-12">
        <div class="alert alert-secondary text-center">
          No hay productos disponibles.
        </div>
      </div>
    {% endfor %}
  </div>
</div>

</body>
</html>

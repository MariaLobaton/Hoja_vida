<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Perfil</title>
</head>
<body>

<h2>Editar Perfil</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
</form>

{% if perfil.fotoperfil %}
    <h3>Foto actual:</h3>
    <img src="{{ perfil.fotoperfil.url }}" width="200">
{% endif %}

</body>
</html>
